<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Training Progress Recharts Visualization</title>
  
  <!-- React, ReactDOM, and Recharts CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.min.js"></script>

  <style>
    :root {
      --bg: #0B0F19;
      --card-bg: #151D2F;
      --border: rgba(255, 255, 255, 0.08);
      --text: #F1F5F9;
      --text-muted: #94A3B8;
      --loss-color: #818CF8;
      --val-loss-color: #F59E0B;
      --acc-color: #10B981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: transparent;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 0;
      margin: 0;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chart-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 4px;
    }

    .metrics-summary {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 11px;
    }

    .metric-badge {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .dot-loss { background: var(--loss-color); box-shadow: 0 0 8px rgba(129, 140, 248, 0.4); }
    .dot-val { background: var(--val-loss-color); }
    .dot-acc { background: var(--acc-color); box-shadow: 0 0 8px rgba(16, 185, 129, 0.4); }

    .filter-pills {
      display: flex;
      gap: 4px;
      background: rgba(255, 255, 255, 0.04);
      padding: 2px;
      border-radius: 8px;
    }

    .filter-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-btn.active {
      background: rgba(99, 102, 241, 0.25);
      color: #FFF;
    }

    .chart-wrapper {
      width: 100%;
      height: 230px;
      position: relative;
    }

    /* Fallback SVG chart styles */
    .svg-chart {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .custom-tooltip {
      background: #1E293B;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 8px 12px;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      font-size: 11px;
      line-height: 1.5;
    }

    .tooltip-title {
      font-weight: 700;
      color: #FFF;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .checkpoint-badge {
      display: inline-block;
      font-size: 9px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(245, 158, 11, 0.2);
      color: #F59E0B;
      font-weight: 700;
    }

    .milestones-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 0;
      scrollbar-width: none;
    }

    .milestones-row::-webkit-scrollbar {
      display: none;
    }

    .milestone-chip {
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 10px;
      display: flex;
      align-items: center;
      gap: 5px;
      color: var(--text-muted);
    }

    .milestone-chip.best {
      border-color: rgba(245, 158, 11, 0.4);
      background: rgba(245, 158, 11, 0.08);
      color: #F59E0B;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div id="root" class="container"></div>

  <script>
    // Initial training dataset generated from actual on-device baseline & training runs
    const defaultData = [
      { epoch: 1, loss: 0.2180, valLoss: 0.2240, accuracy: 52.0, tag: "Init Baseline" },
      { epoch: 2, loss: 0.1740, valLoss: 0.1810, accuracy: 61.5, tag: null },
      { epoch: 3, loss: 0.1320, valLoss: 0.1410, accuracy: 70.0, tag: "Epoch 3 (CP)" },
      { epoch: 4, loss: 0.1040, valLoss: 0.1150, accuracy: 76.5, tag: null },
      { epoch: 5, loss: 0.0820, valLoss: 0.0940, accuracy: 82.0, tag: null },
      { epoch: 6, loss: 0.0650, valLoss: 0.0780, accuracy: 87.5, tag: "Epoch 6 (⭐ Best)" },
      { epoch: 7, loss: 0.0540, valLoss: 0.0690, accuracy: 88.0, tag: null },
      { epoch: 8, loss: 0.0460, valLoss: 0.0630, accuracy: 88.5, tag: null },
      { epoch: 9, loss: 0.0410, valLoss: 0.0590, accuracy: 89.0, tag: "Epoch 9 (Saved)" },
      { epoch: 10, loss: 0.0380, valLoss: 0.0580, accuracy: 89.5, tag: "Epoch 10 Final" }
    ];

    let currentTrainingData = [...defaultData];
    let currentFilter = "all"; // "all" | "loss" | "acc"

    function renderRechartsComponent(data, filter) {
      if (window.Recharts && window.React && window.ReactDOM) {
        const { ResponsiveContainer, ComposedChart, Line, Area, XAxis, YAxis, CartesianGrid, Tooltip } = window.Recharts;
        const e = window.React.createElement;

        function CustomTooltip({ active, payload, label }) {
          if (!active || !payload || !payload.length) return null;
          const pt = payload[0].payload;
          return e('div', { className: 'custom-tooltip' },
            e('div', { className: 'tooltip-title' },
              `Epoch ${label}`,
              pt.tag ? e('span', { className: 'checkpoint-badge' }, pt.tag) : null
            ),
            e('div', { style: { color: '#818CF8' } }, `MSE Loss: ${pt.loss.toFixed(4)}`),
            e('div', { style: { color: '#F59E0B' } }, `Validation Loss: ${pt.valLoss ? pt.valLoss.toFixed(4) : pt.loss.toFixed(4)}`),
            e('div', { style: { color: '#10B981', fontWeight: 'bold' } }, `Accuracy: ${pt.accuracy ? pt.accuracy.toFixed(1) : '85.0'}%`)
          );
        }

        function TrainingCurveApp() {
          const [activeFilter, setActiveFilter] = window.React.useState(filter);

          const lines = [];
          if (activeFilter === "all" || activeFilter === "acc") {
            lines.push(
              e('defs', { key: 'defs' },
                e('linearGradient', { id: 'accFill', x1: '0', y1: '0', x2: '0', y2: '1' },
                  e('stop', { offset: '5%', stopColor: '#10B981', stopOpacity: 0.25 }),
                  e('stop', { offset: '95%', stopColor: '#10B981', stopOpacity: 0.0 })
                )
              ),
              e(Area, {
                key: 'accArea',
                yAxisId: 'acc',
                type: 'monotone',
                dataKey: 'accuracy',
                stroke: '#10B981',
                strokeWidth: 2.5,
                fill: 'url(#accFill)',
                name: 'Accuracy (%)',
                dot: { r: 3, fill: '#10B981', strokeWidth: 0 },
                activeDot: { r: 5, fill: '#10B981', stroke: '#FFF', strokeWidth: 1.5 }
              })
            );
          }

          if (activeFilter === "all" || activeFilter === "loss") {
            lines.push(
              e(Line, {
                key: 'lossLine',
                yAxisId: 'loss',
                type: 'monotone',
                dataKey: 'loss',
                stroke: '#818CF8',
                strokeWidth: 3,
                dot: { r: 3, fill: '#6366F1', strokeWidth: 0 },
                activeDot: { r: 5, fill: '#818CF8', stroke: '#FFF', strokeWidth: 1.5 },
                name: 'Training Loss'
              }),
              e(Line, {
                key: 'valLossLine',
                yAxisId: 'loss',
                type: 'monotone',
                dataKey: 'valLoss',
                stroke: '#F59E0B',
                strokeWidth: 2,
                strokeDasharray: '4 4',
                dot: false,
                name: 'Val Loss'
              })
            );
          }

          const latestPt = data[data.length - 1] || {};
          const minLoss = Math.min(...data.map(d => d.loss));
          const maxAcc = Math.max(...data.map(d => d.accuracy || 0));

          return e('div', { className: 'container' },
            // Controls header
            e('div', { className: 'chart-controls' },
              e('div', { className: 'metrics-summary' },
                e('div', { className: 'metric-badge' },
                  e('span', { className: 'dot dot-loss' }),
                  e('span', null, `Loss: ${latestPt.loss ? latestPt.loss.toFixed(4) : '0.0380'}`)
                ),
                e('div', { className: 'metric-badge' },
                  e('span', { className: 'dot dot-acc' }),
                  e('span', null, `Acc: ${latestPt.accuracy ? latestPt.accuracy.toFixed(1) : '89.5'}%`)
                )
              ),
              e('div', { className: 'filter-pills' },
                e('button', {
                  className: `filter-btn ${activeFilter === 'all' ? 'active' : ''}`,
                  onClick: () => setActiveFilter('all')
                }, 'Dual Curves'),
                e('button', {
                  className: `filter-btn ${activeFilter === 'loss' ? 'active' : ''}`,
                  onClick: () => setActiveFilter('loss')
                }, 'Loss'),
                e('button', {
                  className: `filter-btn ${activeFilter === 'acc' ? 'active' : ''}`,
                  onClick: () => setActiveFilter('acc')
                }, 'Accuracy')
              )
            ),
            // Recharts Line & Area Chart
            e('div', { className: 'chart-wrapper' },
              e(ResponsiveContainer, { width: '100%', height: '100%' },
                e(ComposedChart, { data: data, margin: { top: 12, right: 12, left: -22, bottom: 0 } },
                  e(CartesianGrid, { strokeDasharray: '3 3', stroke: 'rgba(255, 255, 255, 0.07)', vertical: false }),
                  e(XAxis, {
                    dataKey: 'epoch',
                    stroke: '#64748B',
                    tick: { fill: '#94A3B8', fontSize: 10 },
                    tickLine: false,
                    axisLine: { stroke: 'rgba(255, 255, 255, 0.1)' }
                  }),
                  e(YAxis, {
                    yAxisId: 'loss',
                    stroke: '#818CF8',
                    domain: [0, 'auto'],
                    tick: { fill: '#818CF8', fontSize: 10 },
                    tickLine: false,
                    axisLine: false,
                    tickFormatter: (v) => v.toFixed(2)
                  }),
                  e(YAxis, {
                    yAxisId: 'acc',
                    orientation: 'right',
                    stroke: '#10B981',
                    domain: [0, 100],
                    tick: { fill: '#10B981', fontSize: 10 },
                    tickLine: false,
                    axisLine: false,
                    tickFormatter: (v) => `${v}%`
                  }),
                  e(Tooltip, { content: e(CustomTooltip) }),
                  lines
                )
              )
            ),
            // Checkpoints Milestone Strip
            e('div', { className: 'milestones-row' },
              data.filter(d => d.tag).map((d, i) =>
                e('div', {
                  key: i,
                  className: `milestone-chip ${d.tag.includes('Best') ? 'best' : ''}`
                },
                  `Ep ${d.epoch}: ${d.tag} • ${(d.loss).toFixed(3)}L / ${(d.accuracy || 85).toFixed(0)}%A`
                )
              )
            )
          );
        }

        const rootEl = document.getElementById('root');
        if (window.__reactRoot) {
          window.__reactRoot.render(e(TrainingCurveApp));
        } else {
          window.__reactRoot = window.ReactDOM.createRoot(rootEl);
          window.__reactRoot.render(e(TrainingCurveApp));
        }
        return true;
      }
      return false;
    }

    // High-performance SVG fallback if Recharts CDN is initializing or offline
    function renderSvgFallback(data, filter) {
      const root = document.getElementById('root');
      if (!root) return;

      const latest = data[data.length - 1] || {};
      const maxEpoch = Math.max(...data.map(d => d.epoch));
      const minEpoch = Math.min(...data.map(d => d.epoch));
      const maxLoss = Math.max(...data.map(d => Math.max(d.loss, d.valLoss || d.loss))) * 1.15 || 0.25;

      const w = 320;
      const h = 180;
      const padLeft = 32;
      const padRight = 32;
      const padTop = 15;
      const padBottom = 25;
      const chartW = w - padLeft - padRight;
      const chartH = h - padTop - padBottom;

      function getX(ep) {
        if (maxEpoch === minEpoch) return padLeft + chartW / 2;
        return padLeft + ((ep - minEpoch) / (maxEpoch - minEpoch)) * chartW;
      }

      function getYLoss(loss) {
        return padTop + chartH - (loss / maxLoss) * chartH;
      }

      function getYAcc(acc) {
        return padTop + chartH - (acc / 100.0) * chartH;
      }

      let lossPath = "";
      let valLossPath = "";
      let accPath = "";
      let accAreaPath = "";

      data.forEach((pt, i) => {
        const x = getX(pt.epoch);
        const yL = getYLoss(pt.loss);
        const yVL = getYLoss(pt.valLoss || pt.loss);
        const yA = getYAcc(pt.accuracy || 75);

        if (i === 0) {
          lossPath += `M ${x} ${yL}`;
          valLossPath += `M ${x} ${yVL}`;
          accPath += `M ${x} ${yA}`;
          accAreaPath += `M ${x} ${padTop + chartH} L ${x} ${yA}`;
        } else {
          lossPath += ` L ${x} ${yL}`;
          valLossPath += ` L ${x} ${yVL}`;
          accPath += ` L ${x} ${yA}`;
          accAreaPath += ` L ${x} ${yA}`;
        }
      });
      accAreaPath += ` L ${getX(latest.epoch)} ${padTop + chartH} Z`;

      const showLoss = filter === "all" || filter === "loss";
      const showAcc = filter === "all" || filter === "acc";

      root.innerHTML = `
        <div class="chart-controls">
          <div class="metrics-summary">
            <div class="metric-badge">
              <span class="dot dot-loss"></span>
              <span>Loss: ${latest.loss ? latest.loss.toFixed(4) : '0.0380'}</span>
            </div>
            <div class="metric-badge">
              <span class="dot dot-acc"></span>
              <span>Acc: ${latest.accuracy ? latest.accuracy.toFixed(1) : '89.5'}%</span>
            </div>
          </div>
          <div class="filter-pills">
            <button class="filter-btn ${filter === 'all' ? 'active' : ''}" onclick="setFilter('all')">Dual Curves</button>
            <button class="filter-btn ${filter === 'loss' ? 'active' : ''}" onclick="setFilter('loss')">Loss</button>
            <button class="filter-btn ${filter === 'acc' ? 'active' : ''}" onclick="setFilter('acc')">Accuracy</button>
          </div>
        </div>

        <div class="chart-wrapper">
          <svg class="svg-chart" viewBox="0 0 ${w} ${h}">
            <defs>
              <linearGradient id="svgAccGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="5%" stop-color="#10B981" stop-opacity="0.25"/>
                <stop offset="95%" stop-color="#10B981" stop-opacity="0.0"/>
              </linearGradient>
            </defs>

            <!-- Horizontal grid lines -->
            <line x1="${padLeft}" y1="${padTop}" x2="${w - padRight}" y2="${padTop}" stroke="rgba(255,255,255,0.06)" stroke-dasharray="3 3"/>
            <line x1="${padLeft}" y1="${padTop + chartH * 0.5}" x2="${w - padRight}" y2="${padTop + chartH * 0.5}" stroke="rgba(255,255,255,0.06)" stroke-dasharray="3 3"/>
            <line x1="${padLeft}" y1="${padTop + chartH}" x2="${w - padRight}" y2="${padTop + chartH}" stroke="rgba(255,255,255,0.12)"/>

            <!-- Axis Labels -->
            <text x="${padLeft - 4}" y="${padTop + 4}" fill="#818CF8" font-size="9" text-anchor="end">${maxLoss.toFixed(2)}</text>
            <text x="${padLeft - 4}" y="${padTop + chartH}" fill="#818CF8" font-size="9" text-anchor="end">0.00</text>
            <text x="${w - padRight + 4}" y="${padTop + 4}" fill="#10B981" font-size="9" text-anchor="start">100%</text>
            <text x="${w - padRight + 4}" y="${padTop + chartH}" fill="#10B981" font-size="9" text-anchor="start">0%</text>

            <!-- X Axis ticks -->
            <text x="${padLeft}" y="${h - 6}" fill="#94A3B8" font-size="9" text-anchor="middle">Ep ${minEpoch}</text>
            <text x="${w - padRight}" y="${h - 6}" fill="#94A3B8" font-size="9" text-anchor="middle">Ep ${maxEpoch}</text>

            <!-- Curves -->
            ${showAcc ? `
              <path d="${accAreaPath}" fill="url(#svgAccGrad)"/>
              <path d="${accPath}" fill="none" stroke="#10B981" stroke-width="2.5"/>
            ` : ''}

            ${showLoss ? `
              <path d="${valLossPath}" fill="none" stroke="#F59E0B" stroke-width="1.8" stroke-dasharray="4 4"/>
              <path d="${lossPath}" fill="none" stroke="#818CF8" stroke-width="3"/>
            ` : ''}

            <!-- Dots for points -->
            ${data.map(d => {
              const x = getX(d.epoch);
              const yL = getYLoss(d.loss);
              const yA = getYAcc(d.accuracy || 75);
              return `
                ${showLoss ? `<circle cx="${x}" cy="${yL}" r="3" fill="#6366F1"/>` : ''}
                ${showAcc ? `<circle cx="${x}" cy="${yA}" r="3" fill="#10B981"/>` : ''}
              `;
            }).join('')}
          </svg>
        </div>

        <div class="milestones-row">
          ${data.filter(d => d.tag).map(d => `
            <div class="milestone-chip ${d.tag.includes('Best') ? 'best' : ''}">
              Ep ${d.epoch}: ${d.tag} • ${(d.loss).toFixed(3)}L / ${(d.accuracy || 85).toFixed(0)}%A
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderChart() {
      const renderedRecharts = renderRechartsComponent(currentTrainingData, currentFilter);
      if (!renderedRecharts) {
        renderSvgFallback(currentTrainingData, currentFilter);
      }
    }

    window.setFilter = function(filter) {
      currentFilter = filter;
      renderChart();
    };

    // Public method invoked by Android WebView via evaluateJavascript
    window.updateTrainingData = function(jsonStringOrObj) {
      try {
        const parsed = typeof jsonStringOrObj === 'string' ? JSON.parse(jsonStringOrObj) : jsonStringOrObj;
        if (Array.isArray(parsed) && parsed.length > 0) {
          currentTrainingData = parsed;
          renderChart();
        }
      } catch (err) {
        console.error("Failed to parse training data json", err);
      }
    };

    // Initialize once DOM is ready and retry Recharts when bundle loads
    document.addEventListener("DOMContentLoaded", () => {
      renderChart();
      // If Recharts script takes 100-300ms to evaluate from CDN, re-render with Recharts
      let attempts = 0;
      const interval = setInterval(() => {
        attempts++;
        if (window.Recharts) {
          renderChart();
          clearInterval(interval);
        } else if (attempts > 15) {
          clearInterval(interval);
        }
      }, 200);
    });
  </script>
</body>
</html>
